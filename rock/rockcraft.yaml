# single-binary snap prototype as a rock. just the snap binary +
# ca-certs (chisel slice) on a bare base. base snaps install on
# first use and supply everything else (libc, ld-linux, /usr/bin/*).
#
# usage:
#   make rock                      # build snapdrock_*.rock
#   make rock-up                   # podman run -d the rock
#   podman exec -it snap-rock /usr/bin/snap install hello-world
#   podman exec -it snap-rock /usr/bin/snap run hello-world

name: snap-rock
summary: single-binary snap install / run prototype
description: |
  one binary -- /usr/bin/snap -- that can install (download +
  unsquash) and run snaps. no daemon, no state file, no confinement.
  the container is the security boundary; every snap is treated as
  classic. base snaps come down on first install and provide the
  rest of the userland (libc, ld-linux, /usr/bin/*).
license: GPL-3.0
version: '0.1'

base: bare
build-base: ubuntu@24.04

platforms:
  amd64:
  arm64:

environment:
  PATH: /snap/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

parts:
  binary:
    # plugin: dump tracks source content so rockcraft notices when
    # the staged binary changes. plugin: nil with override-build
    # didn't see the update -- the part hash was based only on the
    # build script text, so even after `rockcraft clean binaries`
    # the prime layer reused stale bytes. dump from ./_stage where
    # the Makefile's rock-stage target arranges the destination
    # tree (just usr/bin/snap for now).
    plugin: dump
    source: ./_stage
    source-type: local

  certs:
    plugin: nil
    stage-packages:
      - ca-certificates_data

  rootfs:
    plugin: nil
    after: [certs]
    override-build: |
      install -d $CRAFT_PART_INSTALL/etc
      install -d $CRAFT_PART_INSTALL/snap/bin
      install -d $CRAFT_PART_INSTALL/var/lib/snapd/snaps
      install -d $CRAFT_PART_INSTALL/var/snap
      install -d $CRAFT_PART_INSTALL/tmp
      printf 'root:x:0:0:root:/root:/bin/sh\n' > $CRAFT_PART_INSTALL/etc/passwd
      printf 'root:x:0:\n'                     > $CRAFT_PART_INSTALL/etc/group
      printf 'hosts: files dns\n'              > $CRAFT_PART_INSTALL/etc/nsswitch.conf
